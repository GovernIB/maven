name: Desactivar Sync Workflow en Nous Projectes

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar codi del repositori
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instal·lar dependències
        run: npm install

      - name: Executar script de desactivació
        env:
          ORG_PAT_TOKEN: ${{ secrets.ORG_PAT_TOKEN }}
          TARGET_ORG: ${{ secrets.TARGET_ORG }}
        run: node .github/scripts/disable-sync-workflow.js